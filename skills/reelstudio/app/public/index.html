<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelStudio</title>
<link rel="icon" href="/static/mascot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4EA;--cream-deep:#F5EADA;--ink:#221A14;--ink-soft:#746A60;--ink-faint:#A79C90;--line:#EEE1CF;
  --orange:#C1602E;--orange-bright:#E1590A;--orange-dark:#93481F;--orange-pale:#FBE4D3;--white:#fff;
  --radius-sm:12px;--radius-md:20px;--radius-lg:32px;--shadow:0 30px 60px -25px rgba(34,26,20,.28);--shadow-sm:0 10px 30px -18px rgba(34,26,20,.35);
  --green:#3E8E5B;--red:#B3412E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Jost,-apple-system,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
/* sidebar */
.side{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;gap:4px;-webkit-app-region:drag}
.brandmark{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;font-weight:700;font-size:22px;letter-spacing:-.3px}
.brandmark img{width:42px;height:42px;object-fit:contain}
.brandmark small{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--orange);margin-top:-2px}
.nav{all:unset;-webkit-app-region:no-drag;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;font-weight:500;color:var(--ink-soft)}
.nav:hover{background:var(--cream)}
.nav.on{background:var(--orange-pale);color:var(--orange-dark);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.side .grow{flex:1}
.keypill{-webkit-app-region:no-drag;margin:8px;padding:12px 14px;border-radius:16px;background:var(--cream);font-size:13px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;cursor:pointer}
.dot{width:8px;height:8px;border-radius:9px;background:var(--ink-faint);flex:none}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
/* main */
main{overflow:auto;padding:34px clamp(20px,4vw,48px) 60px}
.eyebrow{display:flex;gap:8px;align-items:center;color:var(--orange);font-weight:600;letter-spacing:2.2px;font-size:12.5px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:34px;line-height:1.08;font-weight:600;letter-spacing:-.7px;margin:0 0 6px}
h1 em{font-style:normal;color:var(--orange)}
h2{font-size:21px;font-weight:600;letter-spacing:-.3px;margin:0 0 14px}
h3{font-size:16px;font-weight:600;margin:0 0 8px}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.55;margin:0 0 26px;max-width:620px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* buttons */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 22px;border-radius:100px;background:var(--orange);color:#fff;font-weight:600;font-size:14px;letter-spacing:.14px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--orange-dark)}
.btn.dark{background:var(--ink)}.btn.dark:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.ghost:hover{background:var(--white)}
.btn.small{padding:8px 15px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{all:unset;cursor:pointer;color:var(--orange);font-weight:600;font-size:14px}
/* cards */
.card{background:var(--white);border-radius:var(--radius-md);padding:22px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.hero{position:relative;overflow:hidden;background:var(--orange);color:#fff;border-radius:var(--radius-lg);padding:30px 34px;display:flex;align-items:center;gap:26px;cursor:pointer;box-shadow:var(--shadow);margin-bottom:34px;transition:.2s}
.hero:hover{transform:translateY(-2px);background:#b8592a}
.hero .mic{width:64px;height:64px;border-radius:99px;background:#fff;color:var(--orange);display:grid;place-items:center;flex:none;font-size:30px;font-weight:300}
.hero b{font-size:24px;font-weight:600;display:block}
.hero span{opacity:.85}
.hero img{position:absolute;right:20px;bottom:-30px;height:170px;opacity:.95;filter:brightness(0) invert(1);opacity:.22}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}
.reel{cursor:pointer;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;transition:.15s;box-shadow:var(--shadow-sm)}
.reel:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.thumb{aspect-ratio:9/16;background:var(--cream-deep);position:relative;display:grid;place-items:center;overflow:hidden}
.thumb img.cov{width:100%;height:100%;object-fit:cover}
.thumb img.m{width:56%;opacity:.5}
.reel .meta{padding:12px 14px 14px}
.reel .t{font-weight:600;line-height:1.25;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reel .s{font-size:12.5px;color:var(--ink-soft);margin-top:6px;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--cream);color:var(--ink-soft)}
.pill.run{background:var(--orange-pale);color:var(--orange-dark)}
.pill.ok{background:#E3F1E7;color:#2D6B44}
.pill.warn{background:#F8E1DC;color:var(--red)}
.pill.review{background:#FFF0C9;color:#7A5A00}
.thumb .pill{position:absolute;top:10px;left:10px}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty img{width:140px;opacity:.9}
/* detail */
.detail{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:30px;align-items:start}
.player{position:sticky;top:0}
.screen{aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:var(--ink);box-shadow:var(--shadow);position:relative}
.screen video,.screen img{width:100%;height:100%;object-fit:cover;display:block}
.screen .wait{position:absolute;inset:0;background:var(--cream-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink-soft);text-align:center;padding:20px}
.screen .wait img{width:46%;height:auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.versions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.versions button{all:unset;cursor:pointer;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--white);border:1px solid var(--line)}
.versions button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 22px}
.stp{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-faint)}
.stp.done{color:var(--ink)}.stp.done i{background:var(--green)}
.stp.now{color:var(--orange-dark);border-color:var(--orange);background:var(--orange-pale)}
.stp.now i{background:var(--orange);animation:pulse 1.2s infinite}
.stp i{width:8px;height:8px;border-radius:9px;background:var(--line)}
@keyframes pulse{50%{opacity:.3}}
.log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
.log div{display:flex;gap:10px;line-height:1.45}
.log time{color:var(--ink-faint);font-size:12px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
.log .step{font-weight:600}
.log .say{color:var(--ink-soft)}
.log .warn{color:var(--red)}
.log .done{color:var(--green);font-weight:600}
.scene{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.scene:first-child{border-top:0}
.scene .n{width:30px;height:30px;border-radius:10px;background:var(--orange-pale);color:var(--orange-dark);display:grid;place-items:center;font-weight:700;font-size:13px}
.scene textarea{width:100%;border:1.5px solid transparent;background:var(--cream);border-radius:12px;padding:10px 12px;resize:vertical;min-height:52px;line-height:1.45;font-size:15px}
.scene textarea:focus{outline:none;border-color:var(--orange);background:#fff}
.scene .v{font-size:13px;color:var(--ink-soft);margin-top:6px}
.scene .id{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.frames img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:var(--cream-deep)}
.stack{display:flex;flex-direction:column;gap:20px}
/* forms */
label.f{display:flex;flex-direction:column;gap:7px;font-weight:600;font-size:13.5px}
label.f small{font-weight:400;color:var(--ink-soft)}
input.i,textarea.i,select.i{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:15px;font-weight:400;width:100%}
textarea.i{min-height:90px;resize:vertical;line-height:1.5}
input.i:focus,textarea.i:focus,select.i:focus{outline:none;border-color:var(--orange)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;font-size:14.5px}
.toggle input{width:18px;height:18px;accent-color:var(--orange)}
input[type=range]{accent-color:var(--orange);width:100%}
/* modal */
.veil{position:fixed;inset:0;background:rgba(34,26,20,.35);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;padding:20px}
.modal{background:var(--cream);border-radius:var(--radius-lg);width:min(620px,100%);max-height:92vh;overflow:auto;padding:30px;box-shadow:var(--shadow)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:30;cursor:zoom-out}
.lightbox img{max-height:92vh;border-radius:20px}
/* looks */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.look{cursor:pointer;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-sm);transition:.15s}
.look:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.look .prev{height:190px;position:relative;display:flex;align-items:flex-end;padding:18px;overflow:hidden}
.look .prev b{font-size:30px;line-height:1;letter-spacing:-.5px;position:relative;z-index:1}
.look .prev img{position:absolute;right:-10px;bottom:-10px;height:150px}
.swatches{display:flex;gap:6px}
.swatches span{width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.08)}
.look .meta{padding:14px 16px}
.refs{display:flex;gap:10px;flex-wrap:wrap}
.refs figure{margin:0;position:relative;width:96px}
.refs img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:#fff}
.refs figure button{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center}
.refs figcaption{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:4px}
.drop{width:96px;height:96px;border-radius:14px;border:1.5px dashed var(--ink-faint);display:grid;place-items:center;color:var(--ink-soft);cursor:pointer;font-size:28px;font-weight:300}
.drop:hover{border-color:var(--orange);color:var(--orange)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:500;z-index:40;box-shadow:var(--shadow)}
.muted{color:var(--ink-soft)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink-soft)}.kv dd{margin:0;font-weight:500}
code{background:var(--cream-deep);padding:2px 7px;border-radius:7px;font-size:13px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:10px;gap:4px}.brandmark{padding:0 8px}.brandmark small,.keypill,.side .grow{display:none}.detail{grid-template-columns:1fr}.player{position:static;max-width:340px}.two,.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brandmark"><img src="/static/mascot.png" alt=""><div>ReelStudio<small>reel factory</small></div></div>
    <button class="nav" data-go="reels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>Reel</button>
    <button class="nav" data-go="brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Brand</button>
    <button class="nav" data-go="looks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.2-1.7-.4-1.1.3-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg>Look</button>
    <button class="nav" data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Impostazioni</button>
    <div class="grow"></div>
    <div class="keypill" data-go="settings"><span class="dot" id="keydot"></span><span id="keytxt">OpenRouter…</span></div>
  </aside>
  <main id="main"></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const api = async (p, o = {}) => { const r = await fetch(p, {headers: {'Content-Type': 'application/json'}, ...o, body: o.body ? JSON.stringify(o.body) : undefined}); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; };
const toast = (t) => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); };
let S = null, route = {view: 'reels'}, timer = null;

const PHASE = {new: ['In attesa', ''], scripting: ['Scrive lo script', 'run'], review: ['Da approvare', 'review'], producing: ['In produzione', 'run'], done: ['Pronto', 'ok'], error: ['Errore', 'warn'], stopped: ['Fermato', 'warn']};
const pill = (ph) => { const [t, c] = PHASE[ph] || [ph, '']; return `<span class="pill ${c}">${c === 'run' ? '<span class="dot" style="background:currentColor;animation:pulse 1.2s infinite"></span>' : ''}${t}</span>`; };
const greet = () => { const h = new Date().getHours(); return h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; };

async function load() {
  S = await api('/api/state');
  $('#keydot').className = 'dot ' + (S.key ? 'ok' : 'bad');
  $('#keytxt').textContent = S.key ? 'OpenRouter collegato' : 'Aggiungi chiave OpenRouter';
}
function go(view, arg) { route = {view, arg}; location.hash = view + (arg ? '/' + arg : ''); render(); }
document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(b.dataset.go));

async function render() {
  clearTimeout(timer);
  await load();
  document.querySelectorAll('.nav').forEach((n) => n.classList.toggle('on', n.dataset.go === route.view || (route.view === 'reel' && n.dataset.go === 'reels') || (route.view === 'look' && n.dataset.go === 'looks')));
  const v = {reels: viewReels, reel: viewReel, brands: viewBrands, looks: viewLooks, look: viewLook, settings: viewSettings}[route.view] || viewReels;
  await v(route.arg);
}

// ---------------- reels ----------------
function viewReels() {
  const m = $('#main');
  m.innerHTML = `
    <div class="eyebrow">◉ La tua fabbrica di reel</div>
    <h1>${greet()}.<br>Cosa <em>raccontiamo</em> oggi?</h1>
    <p class="sub">Scrivi un'idea: il producer prepara lo script, tu lo approvi, la crew registra la voce, illustra, monta, controlla ogni frame e renderizza.</p>
    <div class="hero" id="new"><div class="mic">+</div><div><b>Nuovo reel</b><span>Da un argomento o da uno script</span></div><img src="/static/mascot.png" alt=""></div>
    <div class="row" style="margin-bottom:16px"><h2 style="margin:0">Reel recenti</h2><div class="spacer"></div><span class="muted">${S.reels.length} progetti</span></div>
    ${S.reels.length ? `<div class="grid">${S.reels.map((r) => `
      <div class="reel" data-slug="${r.slug}">
        <div class="thumb">${r.cover ? `<img class="cov" src="${r.cover}">` : '<img class="m" src="/static/mascot.png">'}${pill(r.phase)}</div>
        <div class="meta"><div class="t">${esc(r.title)}</div><div class="s">${esc(S.brands.find((b) => b.id === r.brand)?.name || r.brand)}${r.seconds ? ' · ' + r.seconds + 's' : ''}</div></div>
      </div>`).join('')}</div>` : `<div class="empty"><img src="/static/mascot.png"><p>Ancora nessun reel. Il gatto scriba è pronto a prendere appunti.</p></div>`}`;
  $('#new').onclick = newReel;
  m.querySelectorAll('.reel').forEach((el) => el.onclick = () => go('reel', el.dataset.slug));
  if (S.reels.some((r) => PHASE[r.phase]?.[1] === 'run')) timer = setTimeout(render, 4000);
}

function newReel() {
  const v = document.createElement('div'); v.className = 'veil';
  const def = S.brands.find((b) => b.id === 'scriba') ? 'scriba' : S.brands[0]?.id;
  v.innerHTML = `<div class="modal stack">
    <div><div class="eyebrow">Nuovo reel</div><h2 style="margin:0">Di cosa parliamo?</h2></div>
    <label class="f">Argomento o script<textarea class="i" id="topic" placeholder="Es. Perché rileggere gli appunti non funziona (e cosa fare invece)"></textarea><small>Puoi incollare uno script completo: il producer lo rispetterà.</small></label>
    <div class="two">
      <label class="f">Brand<select class="i" id="brand">${S.brands.map((b) => `<option value="${b.id}" ${b.id === def ? 'selected' : ''}>${esc(b.name || b.id)}${b.look ? ' · look ' + esc(b.look) : ''}</option>`).join('')}</select></label>
      <label class="f"><span>Durata: <span id="secv">30</span> secondi</span><input type="range" id="sec" min="15" max="75" step="5" value="30"></label>
    </div>
    <div class="two">
      <label class="f">Illustrazioni (max)<select class="i" id="imgs">${[0, 1, 2, 3, 4, 6].map((n) => `<option ${n === (S.settings.maxImages ?? 3) ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="f">Qualità immagini<select class="i" id="hero"><option value="">Standard (MAI-Image 2.7) · hero solo dove serve</option><option value="1">Massima (GPT Image 2.6 Sunburst)</option></select></label>
    </div>
    <label class="f">Note per il producer <small>(facoltative)</small><input class="i" id="notes" placeholder="Es. tono più ironico, chiudi con una domanda"></label>
    <label class="toggle"><input type="checkbox" id="auto"> Salta l'approvazione dello script e produci subito</label>
    <div class="row"><div class="spacer"></div><button class="btn ghost" id="x">Annulla</button><button class="btn" id="go">Crea reel</button></div>
  </div>`;
  document.body.append(v);
  $('#sec', v).oninput = (e) => $('#secv', v).textContent = e.target.value;
  $('#x', v).onclick = () => v.remove();
  v.onclick = (e) => { if (e.target === v) v.remove(); };
  $('#topic', v).focus();
  $('#go', v).onclick = async () => {
    try {
      $('#go', v).disabled = true;
      const r = await api('/api/reels', {method: 'POST', body: {topic: $('#topic', v).value, brand: $('#brand', v).value, seconds: $('#sec', v).value, maxImages: $('#imgs', v).value, hero: !!$('#hero', v).value, notes: $('#notes', v).value, autoApprove: $('#auto', v).checked}});
      v.remove(); go('reel', r.slug);
    } catch (e) { toast(e.message); $('#go', v).disabled = false; }
  };
}

const STEPS = [['script', 'Script'], ['review', 'Approvazione'], ['voice', 'Voce'], ['images', 'Illustrazioni'], ['check', 'Controllo frame'], ['render', 'Render']];
function stepState(d) {
  const ph = d.job.phase, step = d.job.step;
  const idx = ph === 'scripting' ? 0 : ph === 'review' ? 1 : ph === 'done' ? 6 : ph === 'producing' ? Math.max(2, STEPS.findIndex((s) => s[0] === step)) : -1;
  return STEPS.map((s, i) => `<div class="stp ${i < idx || ph === 'done' ? 'done' : i === idx && ph !== 'done' ? 'now' : ''}"><i></i>${s[1]}</div>`).join('');
}

        <dt>Tempi parole</dt><dd>${esc(md.stt?.model)}<br><span class="muted" style="font-weight:400">${esc(md.stt?._why)}</span></dd>
      </dl></div>
      <p class="muted" style="font-size:13px">Dati in <code>${esc(S.home)}</code></p>
    </div>`;
  $('#savekey').onclick = async () => { const k = $('#key').value.trim(); if (!k) return; await api('/api/settings', {method: 'PUT', body: {key: k}}); toast('Chiave salvata'); render(); };
  $('#savem').onclick = async () => { await api('/api/settings', {method: 'PUT', body: {model: $('#model').value}}); toast('Salvato'); };
}

const h = location.hash.slice(1).split('/');
if (h[0]) route = {view: h[0], arg: h[1]};
window.onhashchange = () => { const x = location.hash.slice(1).split('/'); if (x[0] !== route.view || x[1] !== route.arg) { route = {view: x[0] || 'reels', arg: x[1]}; render(); } };
render();
</script>
</body>
